<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 사주·궁합</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#EDF0F4;--ink:#1B2A49;--soft:#5A6782;--line:#C9D0DC;--jade:#2F7F79;--seal:#B3362D;--card:#FAFBFC}
@media (prefers-color-scheme:dark){:root{--paper:#141B2B;--ink:#E7EBF3;--soft:#9AA6BF;--line:#2C3750;--jade:#5FB3AB;--seal:#D8574D;--card:#1B2438}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:'Noto Serif KR',serif;line-height:1.8;padding:28px 18px 60px}
main{max-width:560px;margin:0 auto}
h1{font-size:28px;font-weight:800;line-height:1.35;margin:8px 0 6px;letter-spacing:-.02em}
.sub{color:var(--soft);font-size:15px;margin:0 0 24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cd{font:inherit;color:var(--ink);text-align:left;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 14px 14px;cursor:pointer;margin:0;width:auto;font-weight:400;font-size:inherit}
.cd:hover{border-color:var(--jade)}
.cd .ic{display:flex;align-items:center;justify-content:center;height:84px;margin-bottom:12px;background:var(--paper);border-radius:4px;font-size:46px;font-weight:800;color:var(--seal)}
.cd b{display:block;font-size:16px;line-height:1.4}
.cd small{display:block;font-size:12.5px;color:var(--soft);line-height:1.5;margin-top:4px}
.cd[disabled]{opacity:.55;cursor:default}
.cd[disabled]:hover{border-color:var(--line)}
.hero{position:relative;border-radius:6px;overflow:hidden;margin:0 0 20px;border:1px solid var(--line)}
.hero img{display:block;width:100%;height:220px;object-fit:cover;object-position:50% 25%}
.hero div{position:absolute;left:0;right:0;bottom:0;padding:48px 18px 16px;background:linear-gradient(transparent,rgba(10,16,30,.88));color:#fff}
.hero b{display:block;font-size:19px;line-height:1.45}
.hero p{font-size:13.5px;margin:2px 0 0;color:#D5DCEA}
.wait{display:flex;align-items:center;gap:14px;margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px}
.wait img{width:110px;border-radius:4px;display:block}
.wait p{margin:0;font-size:15px;line-height:1.6}
.tip{display:flex;align-items:center;gap:14px;margin-top:20px;padding:12px;background:var(--paper);border-radius:6px}
.tip img{width:84px;height:84px;border-radius:50%;object-fit:cover;flex:none;display:block}
.tip p{margin:0;font-size:14.5px;line-height:1.6}
.cd.wide{grid-column:1/-1}
.cd.wide .ic{height:64px}
.hide{display:none!important}
.back{background:none;border:0;color:var(--soft);font:inherit;font-size:14px;width:auto;margin:0 0 6px;padding:4px 0;cursor:pointer;font-weight:400}
form,.result{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px}
fieldset{border:0;padding:0;margin:0 0 6px}
legend{font-size:15px;font-weight:800;padding:0;margin-bottom:6px;color:var(--jade)}
label{display:block;font-size:14px;font-weight:600;margin:16px 0 6px}
input,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.row{display:flex;gap:10px}.row>div{flex:1}
.chk{display:flex;align-items:center;gap:8px;font-weight:400;margin-top:8px}
.chk input{width:auto}
.tier{display:flex;gap:10px;margin-top:6px}
.tier label{flex:1;margin:0;border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-weight:400;cursor:pointer}
.tier input{width:auto;margin-right:6px}
.tier label:has(input:checked){border-color:var(--jade);background:var(--paper)}
.tier b{display:block;font-weight:600}
.tier small{color:var(--soft);font-size:12.5px;line-height:1.5;display:block}
#codeWrap{display:none}
#go{width:100%;margin-top:22px;font:inherit;font-weight:800;font-size:17px;color:#fff;background:var(--seal);border:0;border-radius:4px;padding:14px;cursor:pointer}
#go:disabled{opacity:.55;cursor:wait}
.err{color:var(--seal);font-size:14px;margin-top:12px;min-height:1em}
.result{margin-top:22px}
.result h2{font-size:19px;margin:0 0 4px}
.meta{color:var(--soft);font-size:13px;margin:0 0 16px;border-bottom:1px solid var(--line);padding-bottom:12px}
.pp{margin:0 0 16px}
.pp>span{display:block;font-size:13px;color:var(--soft);margin-bottom:4px}
.pillars{display:flex;gap:8px}
.pillars div{flex:1;text-align:center;border:1px solid var(--line);border-radius:4px;padding:8px 2px;background:var(--paper)}
.pillars small{display:block;font-size:12px;color:var(--soft)}
.pillars b{font-size:22px;font-weight:800}
.oh{margin:0 0 18px}
.oh div{display:flex;align-items:center;gap:10px;font-size:14px;margin:4px 0}
.oh span{width:22px;font-weight:800}
.oh i{display:block;height:12px;border-radius:2px;min-width:3px}
.oh em{font-style:normal;color:var(--soft);font-size:13px}
.body{white-space:pre-wrap;font-size:16px}
.body p{margin:0 0 8px}
.mchip{display:inline-block;margin:22px 0 8px;background:#2a2a2a;color:#fff;font-size:17px;font-weight:800;padding:2px 14px;border-radius:8px}
.hj{font-size:18px;font-weight:600;margin-top:12px!important}
.note{color:var(--soft);font-size:12.5px;margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
#pdfbtn{width:100%;margin:0 0 16px;font:inherit;font-weight:800;font-size:15px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:11px;cursor:pointer}
.report h2.ch{font-size:20px;margin:30px 0 10px;padding-top:14px;border-top:2px solid var(--ink)}
.report h3{font-size:16px;margin:16px 0 6px;color:var(--jade)}
.report p{margin:0 0 10px}
@media print{
 body{background:#fff;color:#000;padding:0;font-size:11pt}
 #home,#back,#vt,#vs,#f,#wait,#pdfbtn,.hero,.tip{display:none!important}
 .result{border:0;padding:0;margin:0;background:#fff}
 .report h2.ch{break-before:page;border-top:0;font-size:17pt}
 .report h2.ch:first-of-type{break-before:auto}
 .pillars div,.report p{break-inside:avoid}
}
</style>
</head>
<body>
<script>
window.addEventListener('error',function(e){var d=document.createElement('p');d.style.cssText='color:#b3362d;font-size:13px;margin:8px 0';d.textContent='화면 오류: '+e.message+' (줄 '+e.lineno+')';document.body.insertBefore(d,document.body.firstChild);});
</script>

const STEM="갑을병정무기경신임계", BR="자축인묘진사오미신유술해";
const pillar=i=>STEM[i%10]+BR[i%12];
function jdn(y,m,d){const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;
  return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;}
function sunLon(jdUT){const T=(jdUT-2451545)/36525;
  const r=Math.PI/180;
  const L0=280.46646+36000.76983*T+0.0003032*T*T;
  const M=(357.52911+35999.05029*T-0.0001537*T*T)*r;
  const C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(M)+(0.019993-0.000101*T)*Math.sin(2*M)+0.000289*Math.sin(3*M);
  const om=(125.04-1934.136*T)*r;
  let lam=L0+C-0.00569-0.00478*Math.sin(om);
  return ((lam%360)+360)%360;}
// 한국 표준시(UTC+9) 기준 날짜·시각 → 율리우스일(UT)
function jdKST(y,m,d,h,mi){return jdn(y,m,d)-0.5+(h+mi/60-9)/24;}
function inDST(y,m,d){const v=y*10000+m*100+d;return (v>=19870510&&v<=19871011)||(v>=19880508&&v<=19881009);}
function calc(y,m,d,h,mi,unknownTime){
  const dst=inDST(y,m,d);
  const jd=jdKST(y,m,d,h,mi)-(dst?1/24:0), lam=sunLon(jd);
  const off=(lam-315+360)%360, mIdx=Math.floor(off/30);
  const yy=(m===1||(m===2&&lam<315&&lam>=270))?y-1:y;
  const yi=((yy-4)%10+10)%10, yb=((yy-4)%12+12)%12;
  const yearP=STEM[yi]+BR[yb];
  const mb=(2+mIdx)%12, ms=((yi%5)*2+2+mIdx)%10;
  const monthP=STEM[ms]+BR[mb];
  let t=unknownTime?720:h*60+mi-32-(dst?60:0), dj=jdn(y,m,d);
  if(t<0){t+=1440;dj-=1;} if(t>=1380) dj+=1;
  const dayIdx=(dj+49)%60, dayP=pillar(dayIdx);
  let hourP=null;
  if(!unknownTime){
    const hb=Math.floor((((t/60)+1)%24)/2), hs=(((dayIdx%10)%5)*2+hb)%10;
    hourP=STEM[hs]+BR[hb];
  }
  const dd=off%30, edge=Math.min(dd,30-dd)/0.0411;
  return {yearP,monthP,dayP,hourP,edgeHours:edge,dayIdx,yi,mIdx,jd,lam};
}

 const g=t=>(p.find(x=>x.type===t)||{}).value; return {ry:+g('relatedYear'),m:g('month'),d:+g('day')};}

function toSolar(ly,lm,ld,leap){

    basic:"500자 내외. 60갑자 일주 중 어울리는 일주 3가지를 순서대로 고르고, 각각 한두 문장으로 이유를 쓰세요. 점수나 퍼센트 숫자는 쓰지 마세요.",
    full:"1,200자 내외. 어울리는 일주 3가지를 고르고, 각각 【어울리는 이유】【만났을 때 모습】【조심할 점】을 쓰세요. 점수나 퍼센트 숫자는 쓰지 마세요.",
    note:"특정 일주를 '운명의 상대'로 단정하지 말고 '잘 어울리는 편'으로 표현하세요."},
  love:{ic:'戀',t:'앞으로 연애운 보기',d:'올해 월별 연애 흐름',s:'올해 월별 연애 흐름을 풀어 드립니다.',topic:'올해 월별 연애운',
    basic:"500자 내외. 구성: 【타고난 연애 스타일】【올해 연애 흐름 한 줄】【한 가지 조언】. 마지막에 '상세 풀이에서는 월별 흐름을 볼 수 있어요'라고 안내하세요.",
    full:"1,400자 내외. 구성: 【타고난 연애 스타일】【올해 월별 연애 흐름(1~12월 한 줄씩)】【인연이 들어오기 좋은 달】【조심할 달】【실천 조언 3가지】",
    note:"만남이나 결혼을 보장하는 표현은 쓰지 마세요."},
  year:{ic:'年',t:'2027 월별 운세',d:'총운과 12달 흐름',s:'2027년 총운과 달마다의 흐름을 토정비결 형식으로 풀어 드립니다.',topic:'2027년(정미년) 총운과 월별 운세',year:1,
    basic:"총운 한 단락과 1월~12월을 쓰되, 각 월은 항목 1개씩만 쓰세요.",
    full:"총운 한 단락과 1월~12월을 쓰되, 각 월은 항목 3개씩 쓰세요.",
    note:"좋은 달과 조심할 달을 균형 있게 쓰고, '반드시 성공', '큰 재앙' 같은 단정은 쓰지 마세요.",
    extra:"정통 토정비결 144괘를 그대로 옮긴 것이 아니라, 사주와 2027년의 월별 기운을 바탕으로 같은 형식으로 쓴 풀이입니다. 한자 구절은 참고용으로 봐 주세요."}
};

const $ = id => document.getElementById(id);
function showErr(m){ const e=$('err'); e.textContent=m; e.scrollIntoView({block:'center'}); }
const tierEl = () => document.querySelector('input[name=tier]:checked').value;
let cur = null;

function personHTML(id, title){
  return `<legend>${title}</legend>
  <label for="${id}-name">이름 (또는 별명)</label><input id="${id}-name" maxlength="20" autocomplete="off">
  <label for="${id}-date">생년월일</label>
  <div class="row"><div><input id="${id}-date" type="date"></div>
  <div><select id="${id}-cal"><option value="양력">양력</option><option value="음력">음력</option><option value="음력(윤달)">음력 윤달</option></select></div></div>
  <label for="${id}-time">태어난 시간</label><input id="${id}-time" type="time">
  <label class="chk"><input id="${id}-unk" type="checkbox"> 태어난 시간을 몰라요</label>
  <label for="${id}-sex">성별</label><select id="${id}-sex"><option>여성</option><option>남성</option></select>`;
}
$('pa').innerHTML = personHTML('a','나');
$('pb').innerHTML = personHTML('b','상대방');
['a','b'].forEach(id => $(id+'-unk').addEventListener('change', () => { $(id+'-time').disabled = $(id+'-unk').checked; }));

$('grid').innerHTML = Object.keys(MODES).map(k => { const m=MODES[k];
  return m.off
    ? `<button class="cd" disabled type="button"><div class="ic">${m.ic}</div><b>${m.t}</b><small>${m.d} · 준비 중</small></button>`
    : `<button class="cd${m.wide?' wide':''}" data-k="${k}" type="button"><div class="ic">${m.ic}</div><b>${m.t}</b><small>${m.d}</small></button>`; }).join("");
$('grid').addEventListener('click', e => { const b=e.target.closest('.cd[data-k]'); if(b) openMode(b.dataset.k); });
$('back').addEventListener('click', () => { $('view').classList.add('hide'); $('home').classList.remove('hide'); scrollTo(0,0); });

function openMode(k){
  cur=k; const m=MODES[k];
  $('vt').textContent=m.t; $('vs').textContent=m.s;
  $('pb').classList.toggle('hide', !m.two);
  $('tierBox').classList.toggle('hide', !!m.report);
  $('codeWrap').style.display = (m.report || tierEl()==='full') ? 'block' : 'none';
  $('out').classList.add('hide'); $('wait').classList.add('hide'); $('err').textContent="";
  $('home').classList.add('hide'); $('view').classList.remove('hide'); scrollTo(0,0);
}
document.querySelectorAll('input[name=tier]').forEach(r => r.addEventListener('change', () => {
  $('codeWrap').style.display = tierEl() === 'full' ? 'block' : 'none';
}));

function readPerson(id, label){
  const name=$(id+'-name').value.trim() || (id==='b' ? '상대방' : '');
  const date=$(id+'-date').value, cal=$(id+'-cal').value, sex=$(id+'-sex').value;
  if(!name || !date) throw new Error(label+"의 이름과 생년월일을 입력해 주세요.");
  const unk=$(id+'-unk').checked || !$(id+'-time').value;
  const time=unk ? "모름" : $(id+'-time').value;
  let [y,m,d]=date.split("-").map(Number);
  if(cal!=="양력"){ const s=toSolar(y,m,d,cal.includes("윤달")); if(!s) throw new Error(label+"의 음력 날짜를 찾지 못했어요. 윤달 선택과 날짜를 확인해 주세요."); [y,m,d]=s; }
  const [th,tm]=unk?[12,0]:time.split(":").map(Number);
  const P=calc(y,m,d,th,tm,unk);
  return {name,date,cal,sex,time,P,sy:y,sm:m,sd:d,th,tm,unk,solar:y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0")};
}
const pStr = P => `연주 ${P.yearP} / 월주 ${P.monthP} / 일주 ${P.dayP} / 시주 ${P.hourP || "모름"}`;
const who = p => `${p.name} (${p.sex}, ${p.date} ${p.cal}, 태어난 시간 ${p.time})`;

function buildPrompt(A, B, tier){
  const m=MODES[cur];
  const L=["당신은 한국 명리학(사주) 풀이 전문가입니다. 아래 사주 원국은 만세력으로 이미 정확히 계산한 확정값이니 다시 계산하거나 바꾸지 말고 그대로 사용해 풀이하세요. 시주가 '모름'이면 세 기둥으로만 풀이하세요.", ""];
  if(B){ L.push(`첫 번째 사람: ${who(A)}`,`사주 원국: ${pStr(A.P)}`,`두 번째 사람: ${who(B)}`,`사주 원국: ${pStr(B.P)}`); }
  else { L.push(`이름과 정보: ${who(A)}`,`사주 원국: ${pStr(A.P)}`); }
  if(m.year){
    const MP=[[2027,2],[2027,3],[2027,4],[2027,5],[2027,6],[2027,7],[2027,8],[2027,9],[2027,10],[2027,11],[2027,12],[2028,1]].map(x=>calc(x[0],x[1],15,12,0,true).monthP);
    L.push("2027년은 정미년입니다. 달별 월건(절기 기준 사주 월): "+MP.map((p,i)=>(i+1)+"월="+p).join(", ")+". 본인 일간은 '"+A.P.dayP[0]+"'입니다. 이 월건과 본인 사주의 관계를 바탕으로 월별 흐름을 쓰세요.",
      "출력 형식(꼭 지키세요): 첫 줄 '【2027년 총운】', 이어서 4글자 한자 성어 한 줄과 그 한글 독음 한 줄, 해석 두세 문장. 그다음 각 달을 '1월', '2월' … '12월' 단독 한 줄로 시작하고, 그 아래 항목마다 [한자 4글자 + 한자 4글자 구절과 한글 독음을 한 줄에] 쓰고 바로 다음 줄에 한글 풀이 한 문장을 쓰세요. 항목 사이는 빈 줄로 띄우세요.");
  }
  L.push(`주제: ${m.topic}`,"","작성 규칙:",
    "- 한국어 존댓말, 따뜻하고 구체적인 문체. 소제목은 【 】로 표시, 마크다운 기호(#, *)는 쓰지 마세요.",
    "- '반드시', '무조건', '100%' 같은 단정이나 보장성 표현은 쓰지 마세요.",
    "- "+m.note,
    "- 분량과 구성: "+m[tier],
    `- 올해는 ${new Date().getFullYear()}년입니다.`);
  return L.join("\n");
}

async function callAI(prompt) {
  const res = await fetch(ENDPOINT, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({prompt})});
  if (!res.ok) throw new Error("서버 응답 오류 (" + res.status + ")");
  const j = await res.json();
  const text = j.text || j.result || j.answer;
  if (!text) throw new Error("풀이 내용이 비어 있습니다");
  return text;
}

function pillarsHTML(p, label){
  const P=p.P;
  return `<div class="pp"><span>${label}</span><div class="pillars">`+
    [["연주",P.yearP],["월주",P.monthP],["일주",P.dayP],["시주",P.hourP||"-"]].map(x=>`<div><small>${x[0]}</small><b>${x[1]}</b></div>`).join("")+`</div></div>`;
}
function ohHTML(P){
  const cnt={목:0,화:0,토:0,금:0,수:0};
  [P.yearP,P.monthP,P.dayP,P.hourP].filter(Boolean).forEach(s=>[...s].forEach(c=>cnt[EL[c]]++));
  const total=Object.values(cnt).reduce((a,b)=>a+b,0)||1;
  return Object.keys(cnt).map(k=>`<div><span style="color:${ELC[k]}">${k}</span><i style="width:${cnt[k]/total*100*0.8}%;background:${ELC[k]}"></i><em>${cnt[k]}</em></div>`).join("")+
    `<p class="note" style="margin-top:8px;padding-top:0;border:0">겉으로 드러난 글자 기준 오행 개수입니다.</p>`;
}


async function withRetry(fn){ try{ return await fn(); }catch(x){ await new Promise(r=>setTimeout(r,2500)); return await fn(); } }
async function runReport(A, btn){
  $('out').classList.add('hide'); $('wait').classList.remove('hide'); $('wait').scrollIntoView({block:'center'});
  const facts=reportFacts(A), parts=[]; let failed=false;
  for(let i=0;i<CH.length;i++){
    $('wait').querySelector('p').innerHTML="리포트를 쓰는 중이에요 ("+(i+1)+"/"+CH.length+")<br>전체에 몇 분이 걸립니다. 창을 닫지 마세요.";
    try{ parts.push(await withRetry(()=>callAI(RULES+"\n\n[확정 명식 자료]\n"+facts+"\n\n[이번에 쓸 마당]\n"+CH[i].join("\n")))); }
    catch(x){ failed=true; break; }
  }
  $('wait').classList.add('hide'); btn.disabled=false; btn.textContent="풀이 보기";
  if(!parts.length){ showErr("리포트를 불러오지 못했어요. 잠시 후 다시 시도해 주세요."); return; }
  $('rt').textContent=A.name+"님의 정밀 사주 리포트";
  let w="생년월일 "+A.solar+" (양력) · "+(A.time==="모름"?"시간 미상":A.time)+" · "+A.sex;
  if(A.P.edgeHours<2) w+=" · 절기가 바뀌는 시각에 가까워 월주·연주는 만세력 앱으로 한 번 더 확인하세요";
  if(failed) w+=" · 일부 마당을 불러오지 못해 앞부분만 표시합니다. 다시 시도해 주세요";
  $('rm').textContent=w;
  $('rp').innerHTML=pillarsHTML(A,"사주 네 기둥"); $('ro').classList.remove('hide'); $('ro').innerHTML=ohHTML(A.P);
  const rb=$('rb'); rb.textContent=""; rb.style.whiteSpace='normal'; rb.className='body report';
  parts.join("\n").split("\n").forEach(line=>{
    const s=line.trim(); if(!s) return; let el, txt=s;
    if(s.startsWith("## ")){ el=document.createElement("h2"); el.className="ch"; txt=s.slice(3); }
    else if(s.startsWith("### ")){ el=document.createElement("h3"); txt=s.slice(4); }
    else el=document.createElement("p");
    el.textContent=txt.replace(/\*\*/g,""); rb.appendChild(el);
  });
  $('rx').textContent="사주 풀이는 오락과 참고용입니다. 시점은 글자의 순서이며 확정이 아닙니다.";
  $('pdfbtn').classList.remove('hide');
  $('out').classList.remove('hide'); $('out').scrollIntoView({behavior:'smooth'});
}
$('pdfbtn').addEventListener('click',()=>window.print());

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  $('err').textContent = "";
  const m=MODES[cur], tier=m.report?'full':tierEl();
  let A,B=null;
  try { A=readPerson('a', m.two?'나':'본인'); if(m.two) B=readPerson('b','상대방'); }
  catch(x){ showErr(x.message); return; }
  const norm = s => s.toUpperCase().replace(/[\s\-]/g, "");
  if (tier === 'full' && !ORDER_CODES.map(norm).includes(norm($('code').value))) {
    showErr("주문번호가 맞지 않습니다. 구매 내역의 번호를 다시 확인해 주세요."); return;
  }
  const btn=$('go'); btn.disabled=true; btn.textContent="풀이를 만드는 중…";
  if(m.report){ await runReport(A, btn); return; }
  $('out').classList.add('hide'); $('wait').classList.remove('hide'); $('wait').scrollIntoView({block:'center'});
  try {
    const text = await callAI(buildPrompt(A,B,tier));
    $('rt').textContent = B ? `${A.name}님과 ${B.name}님의 궁합` : `${A.name}님의 ${m.t.replace(/^내 /,'')}`;
    let w = tier==='full' ? "상세 풀이" : "기본 풀이";
    [A,B].filter(Boolean).forEach(p=>{
      if(p.cal!=="양력") w += ` · ${p.name}: 음력 ${p.date} → 양력 ${p.solar}`;
      if(p.P.edgeHours<2) w += ` · ${p.name}: 절기가 바뀌는 시각에 가까워 월주·연주는 만세력 앱으로 한 번 더 확인하세요`;
    });
    $('rm').textContent = w;
    $('rp').innerHTML = pillarsHTML(A, B?A.name:"사주 네 기둥") + (B?pillarsHTML(B,B.name):"");
    $('ro').classList.toggle('hide', !m.oh); if(m.oh) $('ro').innerHTML = ohHTML(A.P);
    const rb=$('rb'); rb.textContent="";
    if(m.year){
      rb.style.whiteSpace='normal';
      text.trim().split("\n").forEach(line=>{
        const s=line.trim(); if(!s) return;
        const el=document.createElement(/^\d{1,2}월$/.test(s)?"h3":"p");
        if(el.tagName==="H3") el.className="mchip";
        else if(/[\u4E00-\u9FFF]/.test(s) && !s.startsWith("【")) el.className="hj";
        el.textContent=s; rb.appendChild(el);
      });
    } else { rb.style.whiteSpace='pre-wrap'; rb.textContent = text.trim(); }
    $('rx').textContent = m.extra||"";
    $('out').classList.remove('hide');
    $('out').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth'});
  } catch (x) {
    showErr("풀이를 불러오지 못했어요: " + x.message + ". 잠시 후 다시 시도해 주세요.");
  } finally {
    $('wait').classList.add('hide');
    btn.disabled=false; btn.textContent="풀이 보기";
  }
});
</script>

</html>
