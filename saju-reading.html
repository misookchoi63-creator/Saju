<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 사주·궁합</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#EDF0F4;--ink:#1B2A49;--soft:#5A6782;--line:#C9D0DC;--jade:#2F7F79;--seal:#B3362D;--card:#FAFBFC}
@media (prefers-color-scheme:dark){:root{--paper:#141B2B;--ink:#E7EBF3;--soft:#9AA6BF;--line:#2C3750;--jade:#5FB3AB;--seal:#D8574D;--card:#1B2438}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:'Noto Serif KR',serif;line-height:1.8;padding:28px 18px 60px}
main{max-width:560px;margin:0 auto}
h1{font-size:28px;font-weight:800;line-height:1.35;margin:8px 0 6px;letter-spacing:-.02em}
.sub{color:var(--soft);font-size:15px;margin:0 0 24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cd{font:inherit;color:var(--ink);text-align:left;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 14px 14px;cursor:pointer;margin:0;width:auto;font-weight:400;font-size:inherit}
.cd:hover{border-color:var(--jade)}
.cd .ic{display:flex;align-items:center;justify-content:center;height:84px;margin-bottom:12px;background:var(--paper);border-radius:4px;font-size:46px;font-weight:800;color:var(--seal)}
.cd b{display:block;font-size:16px;line-height:1.4}
.cd small{display:block;font-size:12.5px;color:var(--soft);line-height:1.5;margin-top:4px}
.cd[disabled]{opacity:.55;cursor:default}
.cd[disabled]:hover{border-color:var(--line)}
.hero{position:relative;border-radius:6px;overflow:hidden;margin:0 0 20px;border:1px solid var(--line)}
.hero img{display:block;width:100%;height:220px;object-fit:cover;object-position:50% 25%}
.hero div{position:absolute;left:0;right:0;bottom:0;padding:48px 18px 16px;background:linear-gradient(transparent,rgba(10,16,30,.88));color:#fff}
.hero b{display:block;font-size:19px;line-height:1.45}
.hero p{font-size:13.5px;margin:2px 0 0;color:#D5DCEA}
.wait{display:flex;align-items:center;gap:14px;margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px}
.wait img{width:110px;border-radius:4px;display:block}
.wait p{margin:0;font-size:15px;line-height:1.6}
.tip{display:flex;align-items:center;gap:14px;margin-top:20px;padding:12px;background:var(--paper);border-radius:6px}
.tip img{width:84px;height:84px;border-radius:50%;object-fit:cover;flex:none;display:block}
.tip p{margin:0;font-size:14.5px;line-height:1.6}
.hide{display:none!important}
.back{background:none;border:0;color:var(--soft);font:inherit;font-size:14px;width:auto;margin:0 0 6px;padding:4px 0;cursor:pointer;font-weight:400}
form,.result{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px}
fieldset{border:0;padding:0;margin:0 0 6px}
legend{font-size:15px;font-weight:800;padding:0;margin-bottom:6px;color:var(--jade)}
label{display:block;font-size:14px;font-weight:600;margin:16px 0 6px}
input,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.row{display:flex;gap:10px}.row>div{flex:1}
.chk{display:flex;align-items:center;gap:8px;font-weight:400;margin-top:8px}
.chk input{width:auto}
.tier{display:flex;gap:10px;margin-top:6px}
.tier label{flex:1;margin:0;border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-weight:400;cursor:pointer}
.tier input{width:auto;margin-right:6px}
.tier label:has(input:checked){border-color:var(--jade);background:var(--paper)}
.tier b{display:block;font-weight:600}
.tier small{color:var(--soft);font-size:12.5px;line-height:1.5;display:block}
#codeWrap{display:none}
#go{width:100%;margin-top:22px;font:inherit;font-weight:800;font-size:17px;color:#fff;background:var(--seal);border:0;border-radius:4px;padding:14px;cursor:pointer}
#go:disabled{opacity:.55;cursor:wait}
.err{color:var(--seal);font-size:14px;margin-top:12px;min-height:1em}
.result{margin-top:22px}
.result h2{font-size:19px;margin:0 0 4px}
.meta{color:var(--soft);font-size:13px;margin:0 0 16px;border-bottom:1px solid var(--line);padding-bottom:12px}
.pp{margin:0 0 16px}
.pp>span{display:block;font-size:13px;color:var(--soft);margin-bottom:4px}
.pillars{display:flex;gap:8px}
.pillars div{flex:1;text-align:center;border:1px solid var(--line);border-radius:4px;padding:8px 2px;background:var(--paper)}
.pillars small{display:block;font-size:12px;color:var(--soft)}
.pillars b{font-size:22px;font-weight:800}
.oh{margin:0 0 18px}
.oh div{display:flex;align-items:center;gap:10px;font-size:14px;margin:4px 0}
.oh span{width:22px;font-weight:800}
.oh i{display:block;height:12px;border-radius:2px;min-width:3px}
.oh em{font-style:normal;color:var(--soft);font-size:13px}
.body{white-space:pre-wrap;font-size:16px}
.body p{margin:0 0 8px}
.mchip{display:inline-block;margin:22px 0 8px;background:#2a2a2a;color:#fff;font-size:17px;font-weight:800;padding:2px 14px;border-radius:8px}
.hj{font-size:18px;font-weight:600;margin-top:12px!important}
.note{color:var(--soft);font-size:12.5px;margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
